history:[{id:'evidence',title:A('Evidence from the past','أدلة من الماضي'),body:A('Historians use sources to study the past. A primary source comes from the time being studied. A secondary source interprets earlier evidence.','يستخدم المؤرخون المصادر لدراسة الماضي. المصدر الأولي يعود إلى الفترة المدروسة، والمصدر الثانوي يفسر الأدلة السابقة.'),example:A('A diary written during an event is a primary source.','مذكرات مكتوبة أثناء حدث تعد مصدرًا أوليًا.'),questions:[Q('Which is a primary source?','أي مما يلي مصدر أولي؟',[A('A diary from the time','مذكرات من الفترة نفسها'),A('A modern summary','ملخص حديث'),A('A fictional story','قصة خيالية')],0,'It was created at the time.','كُتبت في الفترة المدروسة.'),Q('Why compare sources?','لماذا نقارن المصادر؟',[A('To ignore evidence','لتجاهل الأدلة'),A('To check evidence','للتحقق من الأدلة'),A('To avoid reading','لتجنب القراءة')],1,'Comparison helps check reliability.','المقارنة تساعد في التحقق من الموثوقية.'),Q('A modern textbook is usually what?','كتاب مدرسي حديث عادة مصدر من أي نوع؟',[A('An artefact','قطعة أثرية'),A('A primary source','مصدر أولي'),A('A secondary source','مصدر ثانوي')],2,'It interprets existing evidence.','يفسر الأدلة الموجودة.')]}],

function mathLesson(){let g=S.grade,k=g<=1?'addition':g<=3?'multiply':g<=5?'fraction':g<=8?'equation':g<=10?'quadratic':'function';let config={addition:[A('Adding numbers','جمع الأعداد'),A('Addition combines quantities. Count the first group, then count on for the second.','الجمع يضم الكميات. ابدأ بالمجموعة الأولى ثم أضف الثانية.'),A('3 + 2 = 5','٣ + ٢ = ٥')],multiply:[A('Multiplication','الضرب'),A('Multiplication combines equal groups. Four groups of three equal twelve.','الضرب يجمع مجموعات متساوية. أربع مجموعات من ثلاثة تساوي اثني عشر.'),A('4 × 3 = 12','٤ × ٣ = ١٢')],fraction:[A('Equivalent fractions','الكسور المتكافئة'),A('Multiply or divide numerator and denominator by the same nonzero number to obtain an equivalent fraction.','اضرب أو اقسم البسط والمقام على نفس العدد غير الصفر لتحصل على كسر مكافئ.'),A('1/2 = 2/4 = 3/6','1/2 = 2/4 = 3/6')],equation:[A('Linear equations','المعادلات الخطية'),A('Isolate the variable by performing the same operation on both sides.','اعزل المتغير بإجراء العملية نفسها على طرفي المعادلة.'),A('2x + 3 = 11 → 2x = 8 → x = 4','2x + 3 = 11 → 2x = 8 → x = 4')],quadratic:[A('Quadratic equations','المعادلات التربيعية'),A('If x² = n², the two solutions are x = n and x = −n for positive n.','إذا كان x² = n² فإن الحلين هما x = n و x = −n عندما n موجب.'),A('x² = 25 → x = ±5','x² = 25 → x = ±5')],function:[A('Differentiation basics','أساسيات التفاضل'),A('The power rule states that the derivative of xⁿ is nxⁿ⁻¹ for positive integer n.','قاعدة القوة: مشتقة xⁿ تساوي nxⁿ⁻¹ عندما n عدد صحيح موجب.'),A('d(x³)/dx = 3x²','d(x³)/dx = 3x²')]}[k];let questions=[];for(let i=0;i<5;i++){let n=2+i,m=3+i%3,ask,ans,wrong,why;if(k==='addition'){ask=n+' + '+m;ans=String(n+m);wrong=[String(n+m+1),String(n+m-1)];why=ask+' = '+ans}else if(k==='multiply'){ask=n+' × '+m;ans=String(n*m);wrong=[String(n*m+n),String(n*m-1)];why=ask+' = '+ans}else if(k==='fraction'){ask='1/'+n+' = ?/'+(n*m);ans=String(m);wrong=[String(m+1),String(m-1)];why='1/'+n+' = '+m+'/'+(n*m)}else if(k==='equation'){ask=m+'x + 2 = '+(m*n+2);ans='x = '+n;wrong=['x = '+(n+1),'x = '+(n-1)];why=m+'x = '+m*n+' → '+ans}else if(k==='quadratic'){ask='x² = '+n*n;ans='x = ±'+n;wrong=['x = '+n,'x = ±'+(n+1)];why=ans}else{ask='d(x^'+n+')/dx';ans=n+'x^'+(n-1);wrong=[n+'x^'+n,'x^'+(n-1)];why=ask+' = '+ans}let opts=[ans,...wrong];let idx=i%3;[opts[0],opts[idx]]=[opts[idx],opts[0]];questions.push(Q(ask,ask,opts.map(x=>A(x,x)),idx,why,why))}return{id:k,title:config[0],body:config[1],example:config[2],questions}}
function topic(id,title,body,example,items){return{id,title,body,example,questions:items.map(x=>Q(x[0],x[1],x[2],x[3],x[4],x[5]))}}
