let active=false,ended=false,paused=false,time=0,score=0,health=3,last=0,targetX=0,boost=0,jump=0,vy=0,attempts=0,shot=null,stage=1,stageDuration=45,goalCount=0,nitro=1,damageFlash=0;const best=saved.arcadeBest||{};const paintColors=[0x187caa,0xca344a,0xe3b85c,0x7752bd];let paintIndex=0;const overlay=$('overlay');function start(){active=true;ended=false;paused=false;overlay.hidden=true;time=0;stageDuration=35+stage*10;health=stage===3?2:3}function pause(){if(ended||(!active&&!paused))return;if(paused){paused=false;active=true;overlay.hidden=true;return}paused=true;active=false;overlay.hidden=false;overlay.textContent=tr('Paused','متوقف مؤقتًا');let b=document.createElement('button');b.textContent=tr('Continue','استمرار');b.onclick=pause;overlay.append(b)}$('pause').onclick=pause;let hd=true;$('quality').onclick=()=>{hd=!hd;R.setPixelRatio(Math.min(devicePixelRatio,hd?1.5:1));R.shadowMap.enabled=hd;$('quality').textContent=hd?'HD':'ECO';R.setSize(innerWidth,innerHeight)};document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)pause()});function finish(){if(ended)return;ended=true;active=false;let coins=Math.max(2,Math.min(30,score));let xp=coins*5;try{let s=JSON.parse(localStorage.getItem('bmAurora')||'{}');s.coins=(Number.isFinite(s.coins)?s.coins:100)+coins;s.rounds=(s.rounds||0)+1;s.xp=(s.xp||0)+xp;s.arcadeBest={...(s.arcadeBest||{}),[mode]:Math.max(score,s.arcadeBest?.[mode]||0)};localStorage.setItem('bmAurora',JSON.stringify(s))}catch{}overlay.hidden=false;overlay.textContent=tr('Round complete','انتهت الجولة')+' · '+score+' | ◈ '+coins+' · XP '+xp+' · '+tr('Best','الأفضل')+' '+Math.max(score,best[mode]||0);let b=document.createElement('button');b.textContent=tr('Play again','العب مرة أخرى');b.onclick=()=>location.reload();overlay.append(b);let a=document.createElement('a');a.href='./';a.textContent=tr('Return home','العودة');a.style.display='block';a.style.marginTop='10px';overlay.append(a)}

function footballSetup(){box(28,.2,46,green,0,-.11,-8);for(let i=0;i<10;i++)box(27.9,.012,4.5,mat(i%2?0x4d8652:0x467d4c),0,.005,12-i*4.5);for(let x of [-12,12])box(.09,.015,43,white,x,.02,-8);for(let z of [-28,12,-15])box(24,.015,.09,white,0,.02,z);for(let x of [-4.5,4.5])box(.16,3.2,.16,white,x,1.6,-16);box(9,.16,.16,white,0,3.2,-16);for(let i=0;i<=18;i++)box(.025,3,.025,white,-4.5+i*.5,1.5,-17.3);for(let i=0;i<=6;i++)box(9,.025,.025,white,0,i*.5,-17.3);for(let side of [-1,1])for(let i=0;i<5;i++){box(2.2,1.1,37,mat(0x344d67),side*(15+i*1.7),.5+i*.65,-8);for(let j=0;j<20;j++)mesh(new T.SphereGeometry(.16,6,4),mat(j%2?0xdab67a:0xb1c5dc),side*(15+i*1.7),1.25+i*.65,-25+j*1.8)}ball=mesh(new T.SphereGeometry(.34,24,16),white,0,.35,2);for(let i=0;i<12;i++){let a=i*2.39996,y=1-2*(i+.5)/12,r=Math.sqrt(1-y*y),n=new T.Vector3(Math.cos(a)*r,y,Math.sin(a)*r);let patch=mesh(new T.CircleGeometry(.105,5),black,n.x*.341,n.y*.341,n.z*.341,ball);patch.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),n)}keeper=group();keeper.position.set(0,0,-15.4);mesh(new T.CapsuleGeometry(.35,.65,6,12),mat(0xe1a447),0,1.05,0,keeper);mesh(new T.SphereGeometry(.28,16,12),mat(0xe7bc99),0,1.95,0,keeper);for(let s of [-1,1]){box(.25,.8,.25,black,s*.22,.43,0,keeper);let arm=mesh(new T.CapsuleGeometry(.12,.55,4,8),mat(0xe1a447),s*.59,1.3,0,keeper);arm.rotation.z=s*.9}cam.position.set(0,4.5,8.7);cam.lookAt(0,1,-12);$('hint').textContent=tr('Tap inside goal to shoot · 5 shots','اضغط داخل المرمى للتسديد · ٥ محاولات');intro('Aim past the moving goalkeeper. Five penalties.','سدد بعيدًا عن الحارس المتحرك. خمس ركلات.')}

const ray=new T.Raycaster(),ndc=new T.Vector2(),goalPlane=new T.Plane(new T.Vector3(0,0,1),16),hit=new T.Vector3();function pointer(e){if(!active)return;const rect=R.domElement.getBoundingClientRect();let u=(e.clientX-rect.left)/rect.width;if(mode!=='football'){targetX=mode==='runner'?[-3,0,3][clamp(Math.floor(u*3),0,2)]:clamp((u-.5)*11,-4.8,4.8);return}if(shot)return;ndc.set(u*2-1,1-(e.clientY-rect.top)/rect.height*2);ray.setFromCamera(ndc,cam);if(ray.ray.intersectPlane(goalPlane,hit)){shot={x:clamp(hit.x,-5.1,5.1),y:clamp(hit.y,.25,3.5),t:0};attempts++}}

function frame(now){requestAnimationFrame(frame);let dt=Math.min(.04,(now-(last||now))/1000);last=now;if(active){time+=dt;if(mode==='football'){keeper.position.x=Math.sin(time*(1.3+stage*.65))*3.3;if(shot){shot.t+=dt*1.45;let p=Math.min(1,shot.t);ball.position.set(shot.x*p,.35+(shot.y-.35)*p+Math.sin(p*Math.PI)*.6,2-18*p);ball.rotation.x-=dt*12;if(p===1&&!shot.done){shot.done=true;let goal=Math.abs(shot.x)<4.2&&shot.y<3.1&&(Math.abs(shot.x-keeper.position.x)>.65+stage*.15||shot.y>2.35);if(goal){score+=5;goalCount++;}$('hint').textContent=goal?tr('GOAL!','هدف!'):tr('Saved / missed','تصدى / خارج');}if(shot.t>1.75){shot=null;ball.position.set(0,.35,2);if(attempts>=5)finish()}}$('hud').textContent=tr('Score','النقاط')+' '+goalCount+' · '+attempts+'/5'}else{let speed=mode==='race'?(boost>0?34:17+stage*2+time*.08):12+stage*2+time*.06;boost=Math.max(0,boost-dt);nitro=Math.min(1,nitro+dt*.095);$('meter').firstElementChild.style.width=(mode==='race'?nitro*100:Math.max(0,100*(1-time/stageDuration)))+'%';if(mode==='race'){cam.fov+=( (boost>0?65:52)-cam.fov)*Math.min(1,dt*5);cam.updateProjectionMatrix()}player.position.x+=(targetX-player.position.x)*Math.min(1,dt*8);if(mode==='race')player.rotation.z=-(targetX-player.position.x)*.05;else{if(vy||jump){vy-=18*dt;jump=Math.max(0,jump+vy*dt);if(jump===0)vy=0}player.position.y=jump;if(mixer)mixer.update(dt)}for(let o of movingScenery){o.position.z+=speed*dt;if(o.position.z>20)o.position.z-=mode==='race'||mode==='runner'?196:196}for(let o of objects){o.position.z+=speed*dt;if(o.userData.coin)o.rotation.y+=dt*2;if(Math.abs(o.position.z-5)<1.05&&Math.abs(o.position.x-player.position.x)<1.15&&!o.userData.hit){o.userData.hit=true;if(o.userData.coin){score+=3;o.visible=false}else if(mode==='race'||jump<.8){health--;damageFlash=.35;o.visible=false}}if(o.position.z>15){if(!o.userData.hit)score++;o.position.z=Math.min(-55,...objects.filter(k=>k!==o).map(k=>k.position.z))-12-rnd()*12;o.position.x=(mode==='race'?[-4,0,4]:[-3,0,3])[Math.floor(r
