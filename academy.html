geography:[{id:'maps',title:A('Reading maps','قراءة الخرائط'),body:A('A map represents a place. A compass shows direction; a legend explains symbols; a scale relates map distance to real distance.','تمثل الخريطة مكانًا. توضح البوصلة الاتجاهات، ويشرح المفتاح الرموز، ويربط مقياس الرسم المسافة على الخريطة بالمسافة الحقيقية.'),example:A('N ↑   E →   S ↓   W ←','شمال ↑   شرق →   جنوب ↓   غرب ←'),questions:[Q('What explains map symbols?','ما الذي يشرح رموز الخريطة؟',[A('Legend','المفتاح'),A('Compass','البوصلة'),A('Title','العنوان')],0,'The legend explains symbols.','مفتاح الخريطة يشرح الرموز.'),Q('Opposite of north?','عكس الشمال؟',[A('East','الشرق'),A('South','الجنوب'),A('West','الغرب')],1,'South is opposite north.','الجنوب عكس الشمال.'),Q('What relates map distance to real distance?','ما الذي يربط المسافة على الخريطة بالحقيقية؟',[A('Colour','اللون'),A('Title','العنوان'),A('Scale','المقياس')],2,'Scale relates the two distances.','مقياس الرسم يربط المسافتين.')]}],

history:[{id:'evidence',title:A('Evidence from the past','أدلة من الماضي'),body:A('Historians use sources to study the past. A primary source comes from the time being studied. A secondary source interprets earlier evidence.','يستخدم المؤرخون المصادر لدراسة الماضي. المصدر الأولي يعود إلى الفترة المدروسة، والمصدر الثانوي يفسر الأدلة السابقة.'),example:A('A diary written during an event is a primary source.','مذكرات مكتوبة أثناء حدث تعد مصدرًا أوليًا.'),questions:[Q('Which is a primary source?','أي مما يلي مصدر أولي؟',[A('A diary from the time','مذكرات من الفترة نفسها'),A('A modern summary','ملخص حديث'),A('A fictional story','قصة خيالية')],0,'It was created at the time.','كُتبت في الفترة المدروسة.'),Q('Why compare sources?','لماذا نقارن المصادر؟',[A('To ignore evidence','لتجاهل الأدلة'),A('To check evidence','للتحقق من الأدلة'),A('To avoid reading','لتجنب القراءة')],1,'Comparison helps check reliability.','المقارنة تساعد في التحقق من الموثوقية.'),Q('A modern textbook is usually what?','كتاب مدرسي حديث عادة مصدر من أي نوع؟',[A('An artefact','قطعة أثرية'),A('A primary source','مصدر أولي'),A('A secondary source','مصدر ثانوي')],2,'It interprets existing evidence.','يفسر الأدلة الموجودة.')]}],

function mathLesson(){let g=S.grade,k=g<=1?'addition':g<=3?'multiply':g<=5?'fraction':g<=8?'equation':g<=10?'quadratic':'function';let config={addition:[A('Adding numbers','جمع الأعداد'),A('Addition combines quantities. Count the first group, then count on for the second.','الجمع يضم الكميات. ابدأ بالمجموعة الأولى ثم أضف الثانية.'),A('3 + 2 = 5','٣ + ٢ = ٥')],multiply:[A('Multiplication','الضرب'),A('Multiplication combines equal groups. Four groups of three equal twelve.','الضرب يجمع مجموعات متساوية. أربع مجموعات من ثلاثة تساوي اثني عشر.'),A('4 × 3 = 12','٤ × ٣ = ١٢')],fraction:[A('Equivalent fractions','الكسور المتكافئة'),A('Multiply or divide numerator and denominator by the same nonzero number to obtain an equivalent fraction.','اضرب أو اقسم البسط والمقام على نفس العدد غير الصفر لتحصل على كسر مكافئ.'),A('1/2 = 2/4 = 3/6','1/2 = 2/4 = 3/6')],equation:[A('Linear equations','المعادلات الخطية'),A('Isolate the variable by performing the same operation on both sides.','اعزل المتغير بإجراء العملية نفسها على طرفي المعادلة.'),A('2x + 3 = 11 → 2x = 8 → x = 4','2x + 3 = 11 → 2x = 8 → x = 4')],quadratic:[A('Quadratic equations','المعادلات التربيعية'),A('If x² = n², the two solutions are x = n and x = −n for positive n.','إذا كان x² = n² فإن الحلين هما x = n و x = −n عندما n موجب.'),A('x² = 25 → x = ±5','x² = 25 → x = ±5')],function:[A('Differentiation basics','أساسيات التفاضل'),A('The power rule states that the derivative of xⁿ is nxⁿ⁻¹ for positive integer n.','قاعدة القوة: مشتقة xⁿ تساوي nxⁿ⁻¹ عندما n عدد صحيح موجب.'),A('d(x³)/dx = 3x²','d(x³)/dx = 3x²')]}[k];let questions=[];for(let i=0;i<5;i++){let n=2+i,m=3+i%3,ask,ans,wrong,why;if(k==='addition'){ask=n+' + '+m;ans=String(n+m);wrong=[String(n+m+1),String(n+m-1)];why=ask+' = '+ans}else if(k==='multiply'){ask=n+' × '+m;ans=String(n*m);wrong=[String(n*m+n),String(n*m-1)];why=ask+' = '+ans}else if(k==='fraction'){ask='1/'+n+' = ?/'+(n*m);ans=String(m);wrong=[String(m+1),String(m-1)];why='1/'+n+' = '+m+'/'+(n*m)}else if(k===
