name: Academy checks
on:
  push:
    branches: [academy-production]
  pull_request:
    branches: [main, academy-production]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
        working-directory: backend
      - run: node --check backend/server.mjs
      - run: node --check academy-cloud.js
